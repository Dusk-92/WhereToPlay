name: Lua checks

on:
  push:
  pull_request:

jobs:
  syntax-and-performance-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find Dusk -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Performance regression guards
        run: |
          ! grep -F 'WhereToPlay:SetWantsUpdates(true)' Dusk/WhereToPlay/UI.lua
          ! grep -F 'function UpdateChecker' Dusk/WhereToPlay/UI.lua
          grep -F 'LevelChanged' Dusk/WhereToPlay/PlayerStats.lua
          grep -F 'RefreshLevelDisplay' Dusk/WhereToPlay/FCT.lua
